<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAS로 성장하는 스포츠 축제 운영판</title>
<meta name="description" content="중학교 학년말 체육 축제(배드민턴 복식 토너먼트, 배구 리그, 레이저 사격, 킨볼, 경품 추첨) 운영용 오프라인 단일 파일 웹앱">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RAS 축제">
<style>
/* ===== Material 3 (Material You) 라이트 테마를 CSS로 직접 구현 =====
   색 역할·글자 체계·모양은 M3 baseline 토큰을 따른다. 외부 폰트·아이콘 없이 시스템 글꼴 사용. */
:root {
  --md-primary: #6750A4; --md-on-primary: #FFFFFF; --md-primary-container: #EADDFF; --md-on-primary-container: #21005D;
  --md-secondary: #625B71; --md-on-secondary: #FFFFFF; --md-secondary-container: #E8DEF8; --md-on-secondary-container: #1D192B;
  --md-tertiary: #7D5260; --md-tertiary-container: #FFD8E4; --md-on-tertiary-container: #31111D;
  --md-error: #B3261E; --md-on-error: #FFFFFF; --md-error-container: #F9DEDC; --md-on-error-container: #410E0B;
  --md-surface: #FEF7FF; --md-on-surface: #1D1B20; --md-on-surface-variant: #49454F; --md-surface-variant: #E7E0EC;
  --md-surface-lowest: #FFFFFF; --md-surface-low: #F7F2FA; --md-surface-container: #F3EDF7; --md-surface-high: #ECE6F0; --md-surface-highest: #E6E0E9;
  --md-outline: #79747E; --md-outline-variant: #CAC4D0;
  --md-inverse-surface: #322F35; --md-inverse-on-surface: #F5EFF7; --md-inverse-primary: #D0BCFF;
  --md-success: #2E7D32; --md-success-container: #DDEFD9; --md-on-success-container: #0B3D12;
  --e1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
  --e2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
  --e3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
  --sh-xs: 4px; --sh-sm: 8px; --sh-md: 12px; --sh-lg: 16px; --sh-xl: 28px; --sh-full: 9999px;
  --fs: 16px;
  --font: Roboto, 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
}
html.fs-large { --fs: 19px; }
html.fs-xl { --fs: 23px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px; }
body { margin: 0; background: var(--md-surface); color: var(--md-on-surface); font: var(--fs)/1.5 var(--font); font-weight: 400; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, p { margin: 0; }
h2 { font-size: 1.375em; line-height: 1.3; font-weight: 500; margin-bottom: 12px; }           /* title-large */
h3 { font-size: 1.05em; line-height: 1.4; font-weight: 500; margin: 20px 0 8px; }             /* title-medium */
b { font-weight: 600; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; background: var(--md-surface-high); padding: 1px 6px; border-radius: var(--sh-xs); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 16px 20px 96px; }
.muted { color: var(--md-on-surface-variant); }
.small { font-size: .875em; }
.nowrap { white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
@media (max-width: 720px) { .grid2, .grid4 { grid-template-columns: 1fr; } .wrap { padding: 12px 12px 96px; } }
.hint { color: var(--md-on-surface-variant); font-size: .875em; line-height: 1.5; }
.lead { color: var(--md-on-surface-variant); font-size: .95em; margin-bottom: 12px; }

/* ===== 버튼: M3 common buttons (높이 44, 알약) ===== */
.btn { position: relative; min-height: 44px; padding: 8px 24px; border-radius: var(--sh-full); border: 1px solid var(--md-outline); background: transparent; color: var(--md-primary); font-weight: 500; font-size: .95em; letter-spacing: .01em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; touch-action: manipulation; transition: box-shadow .15s, background-color .15s; overflow: hidden; }
.btn::after { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none; }
.btn:hover::after { opacity: .08; }
.btn:active::after { opacity: .12; }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn:disabled::after { opacity: 0; }
.btn.primary { background: var(--md-primary); color: var(--md-on-primary); border-color: transparent; box-shadow: none; }
.btn.primary:hover { box-shadow: var(--e1); }
.btn.ok { background: var(--md-primary); color: var(--md-on-primary); border-color: transparent; }
.btn.danger { background: transparent; color: var(--md-error); border-color: var(--md-outline); }
.btn.warn { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); border-color: transparent; }
.btn.tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: transparent; }
.btn.ghost { border-color: transparent; padding-left: 12px; padding-right: 12px; }
.btn.sm { min-height: 40px; padding: 4px 16px; font-size: .875em; }
.btn.big { min-height: 56px; font-size: 1.05em; padding: 10px 32px; }
.btn.light { border-color: transparent; color: var(--md-primary); }

/* ===== 입력: M3 outlined text field 간소화 ===== */
input[type=text], input[type=number], input[type=color], select, textarea { min-height: 48px; padding: 8px 14px; border: 1px solid var(--md-outline); border-radius: var(--sh-xs); background: var(--md-surface-lowest); width: 100%; color: var(--md-on-surface); transition: border-color .15s, box-shadow .15s; }
input:hover, select:hover, textarea:hover { border-color: var(--md-on-surface); }
input:focus, select:focus, textarea:focus { border-color: var(--md-primary); outline: none; box-shadow: inset 0 0 0 1px var(--md-primary); }
input::placeholder, textarea::placeholder { color: var(--md-on-surface-variant); }
input[type=number] { max-width: 120px; }
input[type=color] { width: 56px; padding: 4px; }
textarea { resize: vertical; line-height: 1.5; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .9em; color: var(--md-on-surface-variant); }
label.field input, label.field select { color: var(--md-on-surface); }
label.inline { display: inline-flex; align-items: center; gap: 12px; min-height: 48px; }
/* 체크박스 → M3 스위치 */
input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; flex: 0 0 52px; border-radius: 16px; border: 2px solid var(--md-outline); background: var(--md-surface-highest); position: relative; cursor: pointer; margin: 0; transition: background .2s, border-color .2s; }
input[type=checkbox]::before { content: ''; position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--md-outline); transform: translateY(-50%); transition: left .2s, width .2s, height .2s, background .2s; }
input[type=checkbox]:checked { background: var(--md-primary); border-color: var(--md-primary); }
input[type=checkbox]:checked::before { left: 24px; width: 24px; height: 24px; background: var(--md-on-primary); }
/* 라디오 → M3 radio */
input[type=radio] { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%; border: 2px solid var(--md-on-surface-variant); margin: 0; position: relative; cursor: pointer; }
input[type=radio]:checked { border-color: var(--md-primary); }
input[type=radio]:checked::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--md-primary); }

/* ===== 카드: elevated(섹션) / outlined(내부) ===== */
.card { background: var(--md-surface-low); border: none; border-radius: var(--sh-md); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--e1); }
.card.tight { padding: 16px; background: var(--md-surface-lowest); border: 1px solid var(--md-outline-variant); box-shadow: none; }
.banner { padding: 14px 18px; border-radius: var(--sh-md); margin-bottom: 14px; line-height: 1.5; border: none; }
.banner.warn { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.banner.danger { background: var(--md-error-container); color: var(--md-on-error-container); }
.banner.ok { background: var(--md-success-container); color: var(--md-on-success-container); }
.banner.info { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.banner ul { margin: 6px 0 0; padding-left: 20px; }
.banner .btn.primary { background: var(--md-on-tertiary-container); }

/* ===== 상단: top app bar · 점수 카드 · primary tabs ===== */
header.top { background: var(--md-surface-container); color: var(--md-on-surface); padding: 0 16px 0 24px; min-height: 64px; display: flex; align-items: center; }
header.top > .row { width: 100%; }
header.top .brand { display: flex; align-items: baseline; gap: 12px; }
header.top .title { font-size: 1.375em; font-weight: 500; }
header.top .sub { color: var(--md-on-surface-variant); font-size: .875em; }
#save-status { color: var(--md-on-surface-variant); font-size: .8em; white-space: nowrap; }
.score-strip { background: var(--md-surface-container); padding: 10px 24px 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
.score-strip .tile { display: grid; grid-template-columns: 44px auto auto; gap: 2px 12px; align-items: center; background: var(--md-surface-lowest); border-radius: var(--sh-md); padding: 10px 18px 10px 12px; min-width: 200px; box-shadow: var(--e1); }
.score-strip .tile .bar { width: 44px; height: 44px; border-radius: 50%; grid-row: 1 / span 2; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .8em; }
.score-strip .tile .rank { font-size: .78em; color: var(--md-on-surface-variant); grid-column: 2; font-weight: 500; }
.score-strip .tile .name { font-weight: 600; grid-column: 2; }
.score-strip .tile .pts { grid-column: 3; grid-row: 1 / span 2; font-size: 1.6em; font-weight: 500; text-align: right; letter-spacing: -.01em; }
.score-strip .tile .pts small { font-size: .5em; color: var(--md-on-surface-variant); margin-left: 3px; font-weight: 500; }
.score-strip .status { margin-left: auto; align-self: center; color: var(--md-on-surface-variant); font-size: .85em; text-align: right; max-width: 520px; }
nav.tabs { display: flex; padding: 0 8px; background: var(--md-surface); position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--md-surface-variant); overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { position: relative; flex: 0 0 auto; min-height: 48px; padding: 6px 18px; border: none; background: transparent; color: var(--md-on-surface-variant); font-weight: 500; font-size: .95em; cursor: pointer; border-radius: 0; }
nav.tabs button::before { content: ''; position: absolute; inset: 0; background: var(--md-primary); opacity: 0; transition: opacity .15s; }
nav.tabs button:hover::before { opacity: .08; }
nav.tabs button::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--md-primary); transform: scaleX(0); transition: transform .2s; }
nav.tabs button.active { color: var(--md-primary); }
nav.tabs button.active::after { transform: scaleX(1); }
section.tab { display: none; }
section.tab.active { display: block; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 12px; }
.section-head h2 { margin: 0; }
.section-head .lead { margin: 0; }

/* ===== 반 배지(칩) / 시드 / 태그 ===== */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: var(--sh-sm); color: #fff; font-weight: 600; line-height: 1.4; white-space: nowrap; font-size: .9em; }
.badge.lg { font-size: 1em; padding: 7px 16px; }
.seed { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 7px; border-radius: var(--sh-sm); background: var(--md-primary-container); color: var(--md-on-primary-container); font-weight: 600; font-size: .72em; letter-spacing: .03em; }
.tag { display: inline-block; font-size: .72em; padding: 2px 8px; border-radius: var(--sh-sm); background: var(--md-secondary-container); color: var(--md-on-secondary-container); margin-left: 4px; vertical-align: middle; font-weight: 500; }
.tag.warn { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.tag.ok { background: var(--md-success-container); color: var(--md-on-success-container); }
.tag.danger { background: var(--md-error-container); color: var(--md-on-error-container); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: var(--sh-sm); border: 1px solid var(--md-outline); background: var(--md-surface-lowest); }

/* ===== 표: M3 data table ===== */
table { border-collapse: collapse; width: 100%; background: var(--md-surface-lowest); }
th, td { padding: 12px 14px; text-align: center; border-bottom: 1px solid var(--md-outline-variant); }
th { font-weight: 500; color: var(--md-on-surface-variant); font-size: .875em; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.left, th.left { text-align: left; }
td:first-child { white-space: nowrap; }
.table-wrap { overflow-x: auto; border: 1px solid var(--md-outline-variant); border-radius: var(--sh-md); background: var(--md-surface-lowest); }
.table-wrap table { border: none; }
td input[type=number] { max-width: 90px; text-align: center; min-height: 40px; }
tr.hl { animation: hl 1.6s ease-out; }
@keyframes hl { 0% { background: var(--md-primary-container); } 100% { background: transparent; } }
.rank1 td { background: var(--md-primary-container); color: var(--md-on-primary-container); }
.rank1 td input { color: var(--md-on-surface); }
.rank2 td { background: var(--md-surface-low); }
.modified { background: var(--md-tertiary-container) !important; }

/* ===== 대진표 ===== */
.bracket-scroll { overflow: auto; border-radius: var(--sh-md); background: var(--md-surface-container); padding: 16px; }
.bracket { display: flex; gap: 28px; min-width: max-content; }
.bracket .col { display: flex; flex-direction: column; min-width: 240px; }
.bracket .col h4 { text-align: center; margin: 0 0 10px; position: sticky; top: 0; background: var(--md-surface-container); padding: 6px; z-index: 1; font-weight: 500; font-size: .95em; color: var(--md-on-surface-variant); }
.bracket .col .matches { display: flex; flex-direction: column; justify-content: space-around; flex: 1; }
.match { border: 1px solid var(--md-outline-variant); border-radius: var(--sh-md); background: var(--md-surface-lowest); margin: 4px 0; cursor: pointer; overflow: hidden; transition: box-shadow .15s; }
.match:hover { box-shadow: var(--e2); }
.match.done { border-color: var(--md-outline-variant); }
.match.ready { border: 2px solid var(--md-primary); }
.match .side { display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-height: 40px; font-size: .9em; border-bottom: 1px solid var(--md-outline-variant); }
.match .side:last-child { border-bottom: none; }
.match .side.winner { background: var(--md-secondary-container); color: var(--md-on-secondary-container); font-weight: 600; }
.match .side.loser { color: var(--md-on-surface-variant); }
.match .side.loser .badge { opacity: .5; }
.match .side .names { color: var(--md-on-surface-variant); font-size: .84em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match .side.bye, .match .side.empty { color: var(--md-on-surface-variant); }
.match .mark { margin-left: auto; font-size: .76em; font-weight: 600; color: var(--md-primary); }
.match .side.loser .mark { color: var(--md-error); }
.match .label { font-size: .72em; color: var(--md-on-surface-variant); padding: 5px 10px 0; }

/* ===== 호출판 ===== */
.callboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.callboard .item { border: 1px solid var(--md-outline-variant); border-radius: var(--sh-md); padding: 12px 14px; background: var(--md-surface-lowest); display: flex; flex-direction: column; gap: 6px; }
.callboard .item .court { font-weight: 500; font-size: .86em; color: var(--md-primary); }
.callboard .item .btn { align-self: flex-start; }

/* ===== 킨볼 순위 선택 ===== */
.pick-area { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-area .btn { min-height: 52px; font-size: 1em; border-radius: var(--sh-sm); }

/* ===== 추첨 ===== */
.lottery-stage { text-align: center; padding: 40px 16px; border-radius: var(--sh-xl); background: var(--md-primary-container); color: var(--md-on-primary-container); min-height: 240px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.lottery-stage .muted { color: var(--md-on-primary-container); opacity: .75; }
.lottery-stage .big { font-size: 2.4em; font-weight: 500; letter-spacing: -.01em; }
.lottery-stage .big.spin { animation: spin .12s linear infinite; }
@keyframes spin { 0% { transform: translateY(-3px); } 100% { transform: translateY(3px); } }
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.counts .c { background: var(--md-surface-lowest); border: 1px solid var(--md-outline-variant); border-radius: var(--sh-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.counts .c b { font-size: 1.3em; font-weight: 500; }

/* ===== 타이머 ===== */
.timer { border: 1px solid var(--md-outline-variant); border-radius: var(--sh-lg); padding: 16px; background: var(--md-surface-lowest); text-align: center; }
.timer .time { font-size: 2.9em; font-weight: 400; letter-spacing: -.01em; line-height: 1.1; margin: 6px 0; }
.timer.running { border: 2px solid var(--md-primary); background: var(--md-primary-container); color: var(--md-on-primary-container); }
.timer.ended { border: 2px solid var(--md-error); animation: blink .7s step-start infinite; }
@keyframes blink { 50% { background: var(--md-error-container); } }
.timer .msg { font-weight: 500; color: var(--md-error); min-height: 1.5em; font-size: .9em; }

/* ===== 전광판 ===== */
#scoreboard { position: fixed; inset: 0; background: var(--md-inverse-surface); color: var(--md-inverse-on-surface); z-index: 100; padding: 3vh 4vw; display: none; flex-direction: column; }
#scoreboard.on { display: flex; }
#scoreboard .sb-head { display: flex; justify-content: space-between; align-items: center; font-size: 2.2vw; font-weight: 500; }
#scoreboard .sb-status { font-size: 1.7vw; color: var(--md-inverse-primary); margin: 1vh 0 2vh; }
#scoreboard .sb-rows { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
#scoreboard .sb-row { display: grid; grid-template-columns: 7vw 13vw 1fr 16vw; align-items: center; gap: 2vw; font-size: 4vw; font-weight: 500; padding: 1vh 1.5vw; border-radius: 1.5vw; }
#scoreboard .sb-row .r { opacity: .7; font-size: .7em; }
#scoreboard .sb-row.hl { animation: sbhl 1.5s ease-out; }
@keyframes sbhl { 0% { background: var(--md-inverse-primary); color: var(--md-on-primary-container); } 100% { background: transparent; } }
#scoreboard .bar { height: 5.5vh; border-radius: 9999px; transition: width .6s; min-width: 2vw; }
#scoreboard .sb-foot { font-size: 1.5vw; opacity: .8; margin-top: 1vh; }
#scoreboard .btn { color: var(--md-inverse-primary); border-color: var(--md-inverse-primary); }

/* ===== 대화상자: M3 dialog ===== */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 90; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.on { display: flex; }
.modal { background: var(--md-surface-high); border-radius: var(--sh-xl); padding: 24px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; box-shadow: var(--e3); }
.modal h2 { font-size: 1.3em; font-weight: 400; }
.modal .btn { width: 100%; justify-content: flex-start; margin-top: 8px; min-height: 52px; border-radius: var(--sh-md); background: var(--md-surface-lowest); }
.modal .btn.ok, .modal .btn.primary { background: var(--md-primary); color: var(--md-on-primary); }
.modal .btn.warn { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.modal .btn.danger { color: var(--md-error); }

/* ===== 동점 처리 순서 / 복구 지점 ===== */
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order-list li { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border: 1px solid var(--md-outline-variant); border-radius: var(--sh-md); background: var(--md-surface-lowest); cursor: grab; }
.order-list li.drag { opacity: .4; }
.order-list li .num { font-weight: 500; color: var(--md-primary); min-width: 1.4em; }
.order-list li .sp { flex: 1; font-weight: 500; }
.snap-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow: auto; }

<script>
/* ===================================================================
   배드민턴 복식 대진 알고리즘 (명세 2-5 ~ 2-7, 2-9, 2-10)
   - DOM을 쓰지 않는 순수 함수 모음. node와 브라우저 모두에서 동작.
   =================================================================== */
var Bracket = (function () {
  'use strict';
  var SIZE = 64;

  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  // 포지션 p(1~64)가 속한 구역 번호. size: 2(32강 구역) 4(16강) 8(8강) 16(준결승) 32(결승)
  function region(p, size) { return Math.floor((p - 1) / size); }
  // 1회전 짝 상대 포지션
  function partner(p) { return p % 2 === 1 ? p + 1 : p - 1; }

  function groupByClass(teams, classIds) {
    var m = {};
    classIds.forEach(function (c) { m[c] = []; });
    teams.forEach(function (t) { if (m[t.classId]) m[t.classId].push(t); });
    return m;
  }

  /* ---------- 생성 전 검사 ---------- */
  function precheck(teams, classes, opts) {
    opts = opts || {};
    var errors = [];
    var N = teams.length;
    if (N <= 32 || N > 64) {
      errors.push('참가 조 수가 ' + N + '조입니다. 33조 이상 64조 이하일 때만 64강 대진을 만들 수 있습니다. 조 수를 조정해 주세요.');
      return errors;
    }
    var classIds = classes.map(function (c) { return c.id; });
    var byClass = groupByClass(teams, classIds);
    var B = SIZE - N, M = N - 32; // 부전승 수, 1회전 경기 수
    classes.forEach(function (c) {
      var list = byClass[c.id];
      var seeds = list.filter(function (t) { return t.seed > 0; });
      var tiers = {};
      seeds.forEach(function (t) { tiers[t.seed] = (tiers[t.seed] || 0) + 1; });
      var ok = seeds.length === 4 && [1, 2, 3, 4].every(function (k) { return tiers[k] === 1; });
      if (!ok) errors.push(c.name + ' 반의 시드는 1번~4번이 각각 정확히 1조씩(총 4조) 지정되어야 합니다. (현재 ' + seeds.length + '조 지정)');
      if (list.length * 2 > N) errors.push(c.name + ' 반의 조 수(' + list.length + '조)가 전체 조 수(' + N + '조)의 절반을 넘어, 1회전 같은 반 회피가 수학적으로 불가능합니다.');
    });
    if (errors.length) return errors;
    // 정밀 검사: 부전승을 배분한 뒤 '1회전에 실제로 뛰는 조' 수가 어느 반이든 1회전 경기 수(M)를 넘으면
    // 같은 반 회피가 불가능하다. (부전승은 반별 균등 또는 비례로 배분된다고 가정)
    var counts = {}; classIds.forEach(function (c) { counts[c] = byClass[c].length; });
    var byes;
    if (opts.byeMode === 'proportional') byes = proportionalQuota(counts, B);
    else {
      // 균등: 기본 floor(B/4), 나머지 B%4개는 조 수가 많은 반부터 +1 (가장 유리한 경우)
      var base = Math.floor(B / 4), extra = B % 4;
      var sorted = classIds.slice().sort(function (a, b) { return counts[b] - counts[a]; });
      byes = {};
      sorted.forEach(function (c, i) { byes[c] = base + (i < extra ? 1 : 0); });
      classes.forEach(function (c) {
        if (counts[c.id] < base) errors.push(c.name + ' 반의 조 수(' + counts[c.id] + '조)가 너무 적어 부전승 ' + B + '개를 반별 균등(반마다 ' + base + '개 이상)으로 배분할 수 없습니다. 조 수를 조정하거나 설정에서 "반별 인원 비례"를 선택해 주세요.');
      });
    }
    classes.forEach(function (c) {
      var playing = counts[c.id] - byes[c.id];
      if (playing > M) errors.push(c.name + ' 반은 부전승을 빼고도 1회전에 ' + playing + '조가 뛰어야 하는데 1회전 경기는 ' + M + '경기뿐이라, 같은 반끼리 붙지 않게 짤 수 없습니다. 조 수를 조정해 주세요.');
    });
    return errors;
  }

  /* 비례 배분: 최대 잔여법(largest remainder) */
  function proportionalQuota(counts, total) {
    var sum = 0, ids = Object.keys(counts);
    ids.forEach(function (k) { sum += counts[k]; });
    var q = {}, rema = [], used = 0;
    ids.forEach(function (k) {
      var exact = sum ? counts[k] * total / sum : 0;
      q[k] = Math.floor(exact); used += q[k];
      rema.push({ k: k, r: exact - q[k] });
    });
    rema.sort(function (a, b) { return b.r - a.r; });
    for (var i = 0; used < total && i < rema.length; i++) { q[rema[i].k]++; used++; }
    return q;
  }

  /* ---------- 1회전 같은 반 위반 짝 찾기 ---------- */
  function findViolations(slots, classOf) {
    var v = [];
    for (var k = 1; k <= 32; k++) {
      var a = slots[2 * k - 1], b = slots[2 * k];
      if (a && b && a !== 'BYE' && b !== 'BYE' && classOf(a) === classOf(b)) v.push(k);
    }
    return v;
  }

  /* ===================================================================
     대진 생성
     teams: [{id, classId, seed(0~4)}], classes: [{id, name}]
     opts: { latin: true, byeMode: 'equal' | 'proportional' }
     반환: { ok, slots[1..64], byeTeams, byeCount, warnings[], violations[], latin, attempts }
     =================================================================== */
  function generate(teams, classes, opts) {
    opts = opts || {};
    var useLatin = opts.latin !== false;
    var byeMode = opts.byeMode === 'proportional' ? 'proportional' : 'equal';
    var classIds = classes.map(function (c) { return c.id; });
    var nameOf = {}; classes.forEach(function (c) { nameOf[c.id] = c.name; });
    var teamMap = {}; teams.forEach(function (t) { teamMap[t.id] = t; });
    var classOf = function (id) { return teamMap[id].classId; };

    var errors = precheck(teams, classes, { byeMode: byeMode });
    if (errors.length) return { ok: false, errors: errors, warnings: [], violations: [] };
    var lastResult = null;

    var N = teams.length, B = SIZE - N;
    var byClass = groupByClass(teams, classIds);
    // seedTeam[classId][tier] = team
    var seedTeam = {};
    classIds.forEach(function (c) {
      seedTeam[c] = {};
      byClass[c].forEach(function (t) { if (t.seed > 0) seedTeam[c][t.seed] = t; });
    });
    var counts = {}; classIds.forEach(function (c) { counts[c] = byClass[c].length; });
    var quota = byeMode === 'proportional' ? proportionalQuota(counts, B) : null;

    var MAX_REGEN = 60;
    for (var attempt = 0; attempt < MAX_REGEN; attempt++) {
      var slots = new Array(SIZE + 1).fill(null); // 1~64 사용
      var warnings = [];

      /* STEP 4. 4×4 라틴 방진: L[q][t] = 준결승 구역 q, 티어 t(0=1번…3=4번) → 반 인덱스 */
      var L;
      if (useLatin) {
        var rows = shuffle([0, 1, 2, 3]), cols = shuffle([0, 1, 2, 3]);
        L = rows.map(function (r) { return cols.map(function (c) { return (r + c) % 4; }); });
      } else {
        // 라틴 방진 끔: 티어마다 반 순서를 독립적으로 무작위 배정 (준결승 구역마다 각 티어 1개씩은 유지)
        var perms = [0, 1, 2, 3].map(function () { return shuffle([0, 1, 2, 3]); });
        L = [0, 1, 2, 3].map(function (q) { return [0, 1, 2, 3].map(function (t) { return perms[t][q]; }); });
      }

      /* STEP 1~3. 준결승 구역(16칸) 4개 각각에 1·2·3·4번 시드를 하나씩, 서로 다른 16강 구역(4칸)에 배치 */
      var seedPos = {};
      for (var q = 0; q < 4; q++) {
        var qfA = rnd(2), qfB = 1 - qfA;          // 8강 구역 2개 중 1번 시드가 들어갈 쪽
        var r16a = rnd(2), r16a2 = 1 - r16a;      // qfA 안의 16강 구역 2개
        var r16b = rnd(2), r16b2 = 1 - r16b;      // qfB 안의 16강 구역 2개
        var low = shuffle([2, 3]);                // 3번·4번 시드(티어 인덱스 2,3)
        var placements = [
          [qfA, r16a, 0],       // 1번 시드
          [qfA, r16a2, low[0]], // 1번 시드와 같은 8강 구역의 다른 16강 구역 → 3 또는 4번 (2번 금지)
          [qfB, r16b, 1],       // 2번 시드는 다른 8강 구역
          [qfB, r16b2, low[1]]  // 남은 3·4번 시드
        ];
        placements.forEach(function (pl) {
          var regionIdx = q * 4 + pl[0] * 2 + pl[1]; // 16강 구역 번호 0~15
          var base = regionIdx * 4 + 1;
          var pos = base + rnd(4);
          var cid = classIds[L[q][pl[2]]];
          var team = seedTeam[cid][pl[2] + 1];
          slots[pos] = team.id;
          seedPos[team.id] = pos;
        });
      }

      /* 2-6. 부전승 배정: 티어 우선, 티어 안에서 반 무작위(균등) */
      var byeTeams = {}, byeCount = {};
      classIds.forEach(function (c) { byeCount[c] = 0; });
      var remaining = B;
      var canGive = function (cid) { return quota ? byeCount[cid] < quota[cid] : true; };
      for (var tier = 1; tier <= 4 && remaining > 0; tier++) {
        shuffle(classIds).forEach(function (cid) {
          if (remaining <= 0 || !canGive(cid)) return;
          var t = seedTeam[cid][tier];
          slots[partner(seedPos[t.id])] = 'BYE';
          byeTeams[t.id] = true; byeCount[cid]++; remaining--;
        });
      }
      // 무시드 조 부전승: '현재 부전승 수가 가장 적은 반'부터 무작위 1개씩
      var pool = {};
      classIds.forEach(function (c) { pool[c] = shuffle(byClass[c].filter(function (t) { return t.seed === 0; })); });
      var freePairs = [];
      for (var k = 1; k <= 32; k++) if (!slots[2 * k - 1] && !slots[2 * k]) freePairs.push(k);
      freePairs = shuffle(freePairs);
      while (remaining > 0) {
        var cands = classIds.filter(function (c) { return pool[c].length > 0 && canGive(c); });
        if (!cands.length || !freePairs.length) break;
        if (quota) {
          var maxLeft = Math.max.apply(null, cands.map(function (c) { return quota[c] - byeCount[c]; }));
          cands = cands.filter(function (c) { return quota[c] - byeCount[c] === maxLeft; });
        } else {
          var minB = Math.min.apply(null, cands.map(function (c) { return byeCount[c]; }));
          cands = cands.filter(function (c) { return byeCount[c] === minB; });
          // 같은 수라면 아직 1회전에 뛸 조가 가장 많이 남은 반을 우선 (같은 반 대결 회피에 유리)
          var maxPool = Math.max.apply(null, cands.map(function (c) { return pool[c].length; }));
          cands = cands.filter(function (c) { return pool[c].length === maxPool; });
        }
        var cid2 = cands[rnd(cands.length)];
        var team2 = pool[cid2].pop();
        var pk = freePairs.pop();
        var a = 2 * pk - 1, b = 2 * pk;
        if (rnd(2)) { slots[a] = team2.id; slots[b] = 'BYE'; } else { slots[b] = team2.id; slots[a] = 'BYE'; }
        byeTeams[team2.id] = true; byeCount[cid2]++; remaining--;
      }
      if (remaining > 0) warnings.push('부전승 ' + remaining + '개를 배정할 조가 부족합니다. (조 수를 확인해 주세요)');

      // 반별 부전승 차이 검사 (균등 모드: 1 이내, 비례 모드: 할당량과 일치)
      var vals = classIds.map(function (c) { return byeCount[c]; });
      var diff = Math.max.apply(null, vals) - Math.min.apply(null, vals);
      var balanced = quota ? classIds.every(function (c) { return byeCount[c] === quota[c]; }) : diff <= 1;
      if (!balanced && attempt < MAX_REGEN - 1) continue; // 재생성
      if (!balanced) warnings.push(byeMode === 'equal'
        ? '반별 부전승 수 차이가 1을 넘습니다(' + classIds.map(function (c) { return nameOf[c] + ' ' + byeCount[c]; }).join(', ') + '). 특정 반의 무시드 조가 부족해 균등 배분이 불가능합니다.'
        : '반별 부전승 수가 비례 할당량과 다릅니다(' + classIds.map(function (c) { return nameOf[c] + ' ' + byeCount[c] + '/' + quota[c]; }).join(', ') + ').');

      /* 2-7. 무시드 조 배치 + 1회전 같은 반 회피 (지역 교환 수선, 최대 200회) */
      var placed = {};
      Object.keys(seedPos).forEach(function (id) { placed[id] = true; });
      Object.keys(byeTeams).forEach(function (id) { placed[id] = true; });
      var rest = teams.filter(function (t) { return !placed[t.id]; });
      var freeSlots = [];
      for (var p = 1; p <= SIZE; p++) if (!slots[p]) freeSlots.push(p);
      if (rest.length !== freeSlots.length) {
        return { ok: false, errors: ['내부 오류: 남은 조 수(' + rest.length + ')와 빈 자리 수(' + freeSlots.length + ')가 다릅니다.'], warnings: warnings, violations: [] };
      }
      var movable = {}; freeSlots.forEach(function (p) { movable[p] = true; });
      var violations = [];
      var tries;
      for (tries = 0; tries < 200; tries++) {
        var order = shuffle(rest);
        freeSlots.forEach(function (p, i) { slots[p] = order[i].id; });
        violations = findViolations(slots, classOf);
        if (!violations.length) break;
        var progress = true;
        while (violations.length && progress) {
          progress = false;
          for (var vi = 0; vi < violations.length; vi++) {
            var pk2 = violations[vi];
            var pairSlots = [2 * pk2 - 1, 2 * pk2].filter(function (p) { return movable[p]; });
            var done = false;
            var ps = shuffle(pairSlots);
            for (var x = 0; x < ps.length && !done; x++) {
              var p1 = ps[x], o1 = partner(p1);
              var cand = shuffle(freeSlots);
              for (var y = 0; y < cand.length; y++) {
                var p2 = cand[y];
                if (p2 === p1 || p2 === o1) continue;
                var o2 = partner(p2);
                // 교환 후: p1 자리에 slots[p2], p2 자리에 slots[p1]
                if (classOf(slots[p2]) === classOf(slots[o1])) continue; // 위반 짝이 그대로 남음
                if (classOf(slots[p1]) === classOf(slots[o2])) continue; // 새 위반 발생
                var tmp = slots[p1]; slots[p1] = slots[p2]; slots[p2] = tmp;
                done = true; break;
              }
            }
            if (done) progress = true;
          }
          violations = findViolations(slots, classOf);
        }
        if (!violations.length) break;
      }
      var result = {
        ok: true, slots: slots, byeTeams: byeTeams, byeCount: byeCount, quota: quota,
        warnings: warnings, violations: violations.slice(), latin: L, attempts: attempt + 1, placeTries: tries + 1
      };
      if (!balanced) result.ok = false;
      if (violations.length) {
        result.ok = false;
        lastResult = result;
        if (attempt < MAX_REGEN - 1) continue; // 부전승 배치부터 다시 생성
        result.warnings.push('특정 반의 조 수가 너무 많아 1회전 같은 반 회피가 불가능합니다. (위반 짝 ' + violations.length + '개)');
      }
      return result;
    }
    if (lastResult) return lastResult;
    return { ok: false, errors: ['대진 생성에 실패했습니다.'], warnings: [], violations: [] };
  }

  /* ===================================================================
     2-4 규칙 검사 (검증용)
     =================================================================== */
  function checkRules(result, teams, classes, opts) {
    opts = opts || {};
    var problems = [];

/* ---------- 종목 비중 ---------- */
function computeShare() {
  var p = S.settings.pts;
  var bad = 16 * p.bad.r32 + 8 * p.bad.r16 + 4 * p.bad.r8 + 2 * p.bad.sf + p.bad.runnerUp + p.bad.champion;
  var sumArr = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
  var rows = [
    { name: '배드민턴', total: bad }, { name: '킨볼 (3조 합계)', total: sumArr(p.kin) * 3 },
    { name: '배구', total: sumArr(p.vol) }, { name: '레이저 사격', total: sumArr(p.laser) }
  ];
  var sum = rows.reduce(function (a, r) { return a + r.total; }, 0);
  rows.forEach(function (r) { r.pct = sum ? r.total * 100 / sum : 0; });
  return { rows: rows, sum: sum };
}

/* ---------- 명단 입력 ---------- */
function parseRosterText(text) {
  var out = [];
  String(text || '').split(/\r?\n/).forEach(function (line) {
    line = line.trim(); if (!line) return;
    var m = line.match(/^(\d+)\s*[\t, ]\s*(.+)$/);
    if (m) out.push({ no: num(m[1]), name: m[2].replace(/[",]/g, '').trim() });
    else { var m2 = line.match(/^(.+?)\s*[\t, ]\s*(\d+)$/); if (m2) out.push({ no: num(m2[2]), name: m2[1].replace(/[",]/g, '').trim() }); }
  });
  return out.filter(function (s) { return s.name; });
}
function addStudents(cid, list) {
  var r = S.roster[cid];
  list.forEach(function (s) {
    var dup = r.some(function (x) { return x.no === s.no && x.name === s.name; });
    if (!dup) r.push({ no: s.no, name: s.name });
  });
  r.sort(function (a, b) { return a.no - b.no; });
}
function renderRosterCard(c) {
  var list = S.roster[c.id] || [];
  return '<div class="card tight" data-roster="' + c.id + '"><div class="row between">' + badge(c.id, 'lg') + '<span class="muted">' + list.length + '명</span></div>' +
    '<div class="row" style="margin:8px 0"><input type="number" inputmode="numeric" placeholder="번호" data-add-no style="max-width:90px"><input type="text" placeholder="이름" data-add-name style="flex:1;min-width:100px"><button type="button" class="btn sm primary" data-add-btn>추가</button></div>' +
    '<textarea rows="3" placeholder="여러 줄 붙여넣기\n1\t김○○\n2,이○○\n3 박○○" data-paste></textarea>' +
    '<div class="row" style="margin:6px 0"><button type="button" class="btn sm" data-paste-btn>붙여넣은 내용 추가</button><label class="btn sm">CSV 불러오기 <input type="file" accept=".csv,.txt,text/csv" data-csv hidden></label><button type="button" class="btn sm danger" data-clear-roster>전체 삭제</button></div>' +
    '<div class="table-wrap" style="max-height:260px;overflow:auto"><table><tr><th>번호</th><th>이름</th><th></th></tr>' +
    list.map(function (s, i) { return '<tr><td>' + s.no + '</td><td class="left">' + esc(s.name) + '</td><td><button type="button" class="btn sm ghost" data-del="' + i + '">✕</button></td></tr>'; }).join('') +
    (list.length ? '' : '<tr><td colspan="3" class="muted">아직 명단이 없습니다</td></tr>') + '</table></div></div>';
}
function bindRosterEvents(root) {
  $all('[data-roster]', root).forEach(function (card) {
    var cid = card.dataset.roster;
    $('[data-add-btn]', card).onclick = function () {
      var no = num($('[data-add-no]', card).value), name = $('[data-add-name]', card).value.trim();
      if (!name) { alert('이름을 입력하세요.'); return; }
      addStudents(cid, [{ no: no, name: name }]); commit();
    };
    $('[data-add-name]', card).onkeydown = function (e) { if (e.key === 'Enter') $('[data-add-btn]', card).click(); };
    $('[data-paste-btn]', card).onclick = function () {
      var list = parseRosterText($('[data-paste]', card).value);
      if (!list.length) { alert('읽을 수 있는 줄이 없습니다. "번호 이름" 형식으로 한 줄에 한 명씩 넣어 주세요.'); return; }
      addStudents(cid, list); commit();
    };
    $('[data-csv]', card).onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { var list = parseRosterText(reader.result); if (!list.length) alert('CSV에서 읽을 수 있는 줄이 없습니다.'); else { addStudents(cid, list); commit(); } };
      reader.readAsText(f, 'utf-8'); e.target.value = '';
    };
    $('[data-clear-roster]', card).onclick = function () { if (confirm(classById(cid).name + ' 반 명단을 모두 지울까요?')) { S.roster[cid] = []; commit(); } };
    $all('[data-del]', card).forEach(function (b) { b.onclick = function () { S.roster[cid].splice(num(b.dataset.del), 1); commit(); }; });
  });
}

/* ---------- JSON 내보내기 / 불러오기 ---------- */
function exportJson() {
  if (!S.meta) S.meta = {};
  S.meta.lastBackupAt = Date.now();
  downloadText('RAS축제_백업_' + todayStr() + '.json', JSON.stringify(S, null, 2), 'application/json');
  saveState();
  var el = document.querySelector('#tab-settings');
  if (el && S.ui.tab === 'settings') render();
}
function importJson(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!data || !data.classes || !data.settings) throw new Error('형식 오류');
      if (!confirm('현재 데이터를 불러온 파일의 내용으로 바꿉니다. 계속할까요?')) return;
      S = mergeDeep(defaultState(), data); commit();
      alert('불러오기 완료');
    } catch (e) { alert('JSON 파일을 읽을 수 없습니다: ' + e.message); }
  };
  reader.readAsText(file, 'utf-8');
}

function confirmTeamChange() {
  if (!S.bad.bracket) return true;
  if (!confirm('이미 만든 대진표가 있습니다. 조 편성을 바꾸면 대진표와 경기 결과가 모두 지워집니다. 계속할까요?')) return false;
  S.bad.bracket = null; S.bad.results = {}; S.bad.third = null; S.bad.undo = []; S.bad.redo = [];
  return true;
}
function badTeamsForAlgo() {
  return S.bad.teams.map(function (t) { return { id: t.id, classId: t.classId, num: t.num, seed: num(t.seed) }; });
}
function badOpts() { return { latin: S.settings.latin, byeMode: S.settings.byeMode }; }
function currentRounds() {
  if (!S.bad.bracket) return null;
  return Bracket.buildRounds(S.bad.bracket.slots, S.bad.results);
}
/* 코트·턴 배정: 라운드별로 실제 경기(부전승 제외)에 순서대로 */
function courtAssignments(rounds) {
  var courts = Math.max(1, num(S.settings.courts, 5));
  var map = {};
  rounds.forEach(function (ms) {
    var k = 0;
    ms.forEach(function (m) {
      if (m.type === 'bye') return;
      map[m.key] = { court: (k % courts) + 1, turn: Math.floor(k / courts) + 1 };
      k++;
    });
  });
  return map;
}
function badStatus() {
  var rounds = currentRounds();
  if (!rounds) return { text: '배드민턴 대진 미생성', round: 0 };
  for (var r = 0; r < 6; r++) {
    var pending = rounds[r].some(function (m) { return m.type !== 'bye' && !m.winner; });
    if (pending) return { text: '배드민턴 ' + Bracket.ROUND_NAMES[r] + ' 진행 중', round: r + 1 };
  }
  var champ = rounds[5][0].winner;
  return { text: '배드민턴 종료 · 우승 ' + (champ && teamById(champ) ? teamShort(teamById(champ)) : ''), round: 7 };
}
function badClassPoints() {
  var rounds = currentRounds();
  if (!rounds) { var z = {}; CLASS_IDS.forEach(function (c) { z[c] = 0; }); return { total: z, detail: {} }; }
  return Bracket.classPoints(rounds, S.bad.teams, S.settings.pts.bad, S.settings.byePoints);
}
function sideHtml(id, m, pos) {
  if (id === 'BYE') return '<div class="side bye">부전승</div>';
  if (!id) return '<div class="side empty">(대기)</div>';
  var t = teamById(id); if (!t) return '<div class="side empty">?</div>';
  var cls = 'side';
  if (m.winner) cls += (m.winner === id ? ' winner' : ' loser');
  var mark = '';
  if (m.winner === id && m.type === 'bye') mark = '부전승';
  else if (m.winner === id) mark = '승';
  else if (m.winner && m.type === 'forfeit') mark = '몰수';
  return '<div class="' + cls + '" style="--cls:' + esc(classById(t.classId).color) + '">' + badge(t.classId) + '<b>' + t.num + '조</b>' + seedMark(num(t.seed)) + '<span class="names">' + esc(t.p1) + '·' + esc(t.p2) + '</span><span class="mark">' + mark + '</span></div>';
}
function pushUndo() {
  S.bad.undo.push(JSON.stringify({ results: S.bad.results, third: S.bad.third }));
  if (S.bad.undo.length > 100) S.bad.undo.shift();
  S.bad.redo = [];
}
function badUndo() {
  if (!S.bad.undo.length) return;
  S.bad.redo.push(JSON.stringify({ results: S.bad.results, third: S.bad.third }));
  var s = JSON.parse(S.bad.undo.pop()); S.bad.results = s.results; S.bad.third = s.third; commit();
}
function badRedo() {
  if (!S.bad.redo.length) return;
  S.bad.undo.push(JSON.stringify({ results: S.bad.results, third: S.bad.third }));
  var s = JSON.parse(S.bad.redo.pop()); S.bad.results = s.results; S.bad.third = s.third; commit();
}
/* 결과 저장: 이후 라운드의 관련 결과는 지운다 */
function setMatchResult(r, i, winner, type) {
  pushUndo();
  var key = r + '-' + i;
  if (winner) S.bad.results[key] = { winner: winner, type: type || 'win' }; else delete S.bad.results[key];
  var idx = i;
  for (var rr = r + 1; rr <= 6; rr++) { idx = Math.floor(idx / 2); delete S.bad.results[rr + '-' + idx]; }
  if (r >= 5) S.bad.third = null;
  commit();
}
function openMatchModal(m) {
  if (!m.a || !m.b || m.a === 'BYE' || m.b === 'BYE') return;
  var ta = teamById(m.a), tb = teamById(m.b);
  if (!ta || !tb) return;
  openModal('<h2>' + Bracket.ROUND_NAMES[m.r - 1] + ' ' + (m.i + 1) + '경기 · 승자 선택</h2>' +
    '<p>' + badge(ta.classId) + ' ' + esc(teamFull(ta)) + ' <b>vs</b> ' + badge(tb.classId) + ' ' + esc(teamFull(tb)) + '</p>' +
    '<button type="button" class="btn ok" data-win="a">' + esc(teamShort(ta)) + ' 승</button>' +
    '<button type="button" class="btn ok" data-win="b">' + esc(teamShort(tb)) + ' 승</button>' +
    '<button type="button" class="btn warn" data-forfeit="a">' + esc(teamShort(ta)) + ' 몰수패 (미출석·경기 거부) → ' + esc(teamShort(tb)) + ' 진출</button>' +
    '<button type="button" class="btn warn" data-forfeit="b">' + esc(teamShort(tb)) + ' 몰수패 → ' + esc(teamShort(ta)) + ' 진출</button>' +
    (m.winner ? '<button type="button" class="btn danger" data-clear>이 경기 결과 취소 (이후 라운드 결과도 지워짐)</button>' : '') +
    '<button type="button" class="btn" data-close>닫기</button>');
  var md = $('#modal');
  $all('[data-win]', md).forEach(function (b) { b.onclick = function () { closeModal(); setMatchResult(m.r, m.i, b.dataset.win === 'a' ? m.a : m.b, 'win'); }; });
  $all('[data-forfeit]', md).forEach(function (b) { b.onclick = function () { closeModal(); setMatchResult(m.r, m.i, b.dataset.forfeit === 'a' ? m.b : m.a, 'forfeit'); }; });
  var c = $('[data-clear]', md); if (c) c.onclick = function () { closeModal(); setMatchResult(m.r, m.i, null); };
  $('[data-close]', md).onclick = closeModal;
}
function thirdPlaceInfo(rounds) {
  var sf = rounds[4];
  if (!sf[0].winner || !sf[1].winner) return null;
  var la = sf[0].winner === sf[0].a ? sf[0].b : sf[0].a;
  var lb = sf[1].winner === sf[1].a ? sf[1].b : sf[1].a;
  if (!la || !lb || la === 'BYE' || lb === 'BYE') return null;
  return { a: la, b: lb, winner: S.bad.third && (S.bad.third.winner === la || S.bad.third.winner === lb) ? S.bad.third.winner : null, type: S.bad.third ? S.bad.third.type : null };
}

TAB_RENDERERS.bad = function (root) {
  var teams = S.bad.teams;
  var N = teams.length;
  var pre = Bracket.precheck(badTeamsForAlgo(), S.classes, badOpts());

  // ---- 1. 조 편성 ----

    '<div class="grid4">' + S.classes.map(function (c) {

      return '<div class="card tight" data-teamcard="' + c.id + '">' +

        '<select data-seed style="width:auto"><option value="0">무시드</option><option value="1">1번 시드</option><option value="2">2번 시드</option><option value="3">3번 시드</option><option value="4">4번 시드</option></select>' +
        '<button type="button" class="btn sm primary" data-add-team>추가</button></div>' +
        '<textarea rows="2" placeholder="여러 줄 붙여넣기: 김○○, 이○○ S1" data-team-paste></textarea><div class="row" style="margin:6px 0"><button type="button" class="btn sm" data-team-paste-btn>붙여넣은 내용 추가</button><button type="button" class="btn sm danger" data-team-clear>이 반 조 전체 삭제</button></div>' +
        '<div class="table-wrap" style="max-height:300px;overflow:auto"><table><tr><th>조</th><th>선수</th><th>시드</th><th></th></tr>' +
        list.map(function (t) {
          return '<tr><td><b>' + t.num + '조</b></td><td class="left">' + esc(t.p1) + '·' + esc(t.p2) + '</td><td><select data-seed-of="' + t.id + '" style="min-width:5em">' +
            [0, 1, 2, 3, 4].map(function (s) { return '<option value="' + s + '" ' + (num(t.seed) === s ? 'selected' : '') + '>' + (s ? s + '번' : '무시드') + '</option>'; }).join('') +
            '</select></td><td><button type="button" class="btn sm ghost" data-del-team="' + t.id + '">✕</button></td></tr>';
        }).join('') + (list.length ? '' : '<tr><td colspan="4" class="muted">조가 없습니다</td></tr>') + '</table></div></div>';
    }).join('') + '</div></details></div>';

  // ---- 2. 대진표 생성 ----
  var M = N - 32, B = 64 - N;
  html += '<div class="card no-print"><h2>2. 대진표 생성</h2>' +
    '<div class="row"><span>참가 <b>' + N + '조</b></span><span>→ 1회전 경기 <b>' + (N > 32 ? M : '-') + '</b></span><span>부전승 <b>' + (N > 32 && N <= 64 ? B : '-') + '</b></span>' +
    '<span class="muted small">(라틴 방진 ' + (S.settings.latin ? 'ON' : 'OFF') + ' · 부전승 ' + (S.settings.byeMode === 'equal' ? '반별 균등' : '인원 비례') + ' · 코트 ' + S.settings.courts + '면)</span></div>' +
    (pre.length ? '<div class="banner warn" style="margin-top:10px">대진을 만들기 전에 확인하세요:<ul>' + pre.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '') +
    '<div class="row" style="margin-top:10px"><button type="button" class="btn big primary" id="btn-gen" ' + (pre.length ? 'disabled' : '') + '>랜덤 대진표 생성</button>' +
    (bracket ? '<button type="button" class="btn danger" id="btn-del-bracket">대진표 삭제</button>' : '') + '</div>' +
    (bracket && bracket.warnings && bracket.warnings.length ? '<div class="banner danger" style="margin-top:10px">경고<ul>' + bracket.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>' +
      (bracket.violations && bracket.violations.length ? '<div>위반 짝: ' + bracket.violations.map(function (k) { var a = teamById(bracket.slots[2 * k - 1]), b = teamById(bracket.slots[2 * k]); return (k) + '경기 (' + (a ? teamShort(a) : '?') + ' vs ' + (b ? teamShort(b) : '?') + ')'; }).join(', ') + '</div>' : '') + '</div>' : '') +
    (bracket ? '<p class="hint" style="margin-top:8px">생성 ' + esc(bracket.generatedAt || '') + ' · 반별 부전승: ' + CLASS_IDS.map(function (c) { return classById(c).name + ' ' + (bracket.byeCount[c] || 0) + '개'; }).join(', ') + '</p>' : '') +
    '</div>';

  if (bracket) {
    var rounds = currentRounds();
    var courts = courtAssignments(rounds);
    var st = badStatus();
    var third = thirdPlaceInfo(rounds);

    // ---- 3. 호출판 + 조작 ----
    var curRound = st.round >= 1 && st.round <= 6 ? rounds[st.round - 1] : null;
    html += '<div class="card no-print"><div class="row between"><h2>3. 진행 · ' + esc(st.text) + '</h2>' +
      '<div class="row"><button type="button" class="btn" id="btn-undo" ' + (S.bad.undo.length ? '' : 'disabled') + '>되돌리기 (' + S.bad.undo.length + ')</button><button type="button" class="btn" id="btn-redo" ' + (S.bad.redo.length ? '' : 'disabled') + '>다시 실행</button>' +
      '<button type="button" class="btn" id="btn-print-bracket">인쇄</button><button type="button" class="btn" id="btn-png-bracket">PNG 저장</button></div></div>' +
      '<p class="hint">경기 블록을 누르면 승자를 고를 수 있습니다. 몰수패도 같은 창에서 처리합니다. 다음 경기 호출판은 현재 라운드의 남은 경기를 코트·턴 순으로 보여줍니다.</p>';
    if (curRound) {
      var items = curRound.filter(function (m) { return m.type !== 'bye' && !m.winner; });
      html += '<h3>다음 경기 호출판 · ' + Bracket.ROUND_NAMES[st.round - 1] + ' (남은 ' + items.length + '경기)</h3><div class="callboard">' + items.map(function (m) {
        var ca = courts[m.key]; var ta = teamById(m.a), tb = teamById(m.b);
        var ready = ta && tb;
        return '<div class="item" style="' + (ready ? '' : 'opacity:.55') + '"><div class="court">' + ca.turn + '턴 / ' + ca.court + '코트</div><div>' + (ta ? badge(ta.classId) + ' ' + esc(teamShort(ta)) : '<span class="muted">(대기)</span>') + ' <b>vs</b> ' + (tb ? badge(tb.classId) + ' ' + esc(teamShort(tb)) : '<span class="muted">(대기)</span>') + '</div>' +
          (ready ? '<button type="button" class="btn sm" data-open-match="' + m.key + '" style="margin-top:6px">결과 입력</button>' : '') + '</div>';
      }).join('') + '</div>';
    }
    html += '</div>';

    // ---- 4. 대진표 ----
    html += '<div class="card bracket-card"><h2 class="print-only">RAS 스포츠 축제 · 배드민턴 복식 대진표</h2><div class="bracket-scroll"><div class="bracket" id="bracket-view">' +
      rounds.map(function (ms, ri) {
        return '<div class="col"><h4>' + Bracket.ROUND_NAMES[ri] + '</h4><div class="matches">' + ms.map(function (m) {
          var ca = courts[m.key];
          var clickable = m.a && m.b && m.a !== 'BYE' && m.b !== 'BYE';
          var cls = 'match' + (m.winner && m.type !== 'bye' ? ' done' : '') + (clickable && !m.winner ? ' ready' : '');
          return '<div class="' + cls + '" ' + (clickable ? 'data-open-match="' + m.key + '"' : '') + '><div class="label">' + (m.i + 1) + '경기' + (ca ? ' · ' + ca.turn + '턴 ' + ca.court + '코트' : '') + '</div>' + sideHtml(m.a, m, 'a') + sideHtml(m.b, m, 'b') + '</div>';
        }).join('') + '</div></div>';
      }).join('') +
      // 3·4위전 열
      '<div class="col"><h4>3·4위전</h4><div class="matches">' + (third ?
        '<div class="match ' + (third.winner ? 'done' : 'ready') + '" data-open-third="1"><div class="label">준결승 패자 간 경기</div>' + sideHtml(third.a, third, 'a') + sideHtml(third.b, third, 'b') + '</div>'
        : '<div class="match"><div class="side empty">준결승 2경기가 끝나면 생깁니다</div></div>') +
      '<p class="hint" style="padding:6px">3·4위전은 반 점수에 영향이 없습니다. 두 조 모두 "준결승 진출" ' + S.settings.pts.bad.sf + '점으로 확정됩니다.</p></div></div>' +
      '</div></div></div>';

    // ---- 5. 점수 ----
    var cp = badClassPoints();
    html += '<div class="card"><h2>5. 배드민턴 반 점수 (조별 최종 진출 점수의 합, 비누적)</h2>' +
      '<p class="hint">각 조는 마지막으로 도달한 라운드의 점수 하나만 반영됩니다. 1회전 패 0 / 32강 ' + S.settings.pts.bad.r32 + ' / 16강 ' + S.settings.pts.bad.r16 + ' / 8강 ' + S.settings.pts.bad.r8 + ' / 준결승 ' + S.settings.pts.bad.sf + ' / 준우승 ' + S.settings.pts.bad.runnerUp + ' / 우승 ' + S.settings.pts.bad.champion + '. 부전승 32강 진출 점수 인정: ' + (S.settings.byePoints ? 'ON' : 'OFF') + '</p>' +
      S.classes.map(function (c) {

  root.innerHTML = html;

  // ---- 이벤트 ----

    var cid = card.dataset.teamcard;
    $('[data-add-team]', card).onclick = function () {

      S.bad.teams.push({ id: newId(), classId: cid, num: 0, p1: p1, p2: p2, seed: seed }); renumberTeams(); commit();

    $('[data-p2]', card).onkeydown = function (e) { if (e.key === 'Enter') $('[data-add-team]', card).click(); };

      var lines = $('[data-team-paste]', card).value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
      var added = [];
      lines.forEach(function (l) {
        var seed = 0; var ms = l.match(/\b[Ss](\d)\b/); if (ms) { seed = num(ms[1]); l = l.replace(ms[0], ''); }
        var parts = l.split(/[,\t·/]+|\s+/).map(function (x) { return x.trim(); }).filter(Boolean);
        if (parts.length >= 2) added.push({ id: newId(), classId: cid, num: 0, p1: parts[0], p2: parts[1], seed: seed > 4 ? 0 : seed });
      });
      if (!added.length) { alert('읽을 수 있는 줄이 없습니다. 한 줄에 "이름1, 이름2" 형식으로 넣어 주세요.'); return; }
      if (!confirmTeamChange()) return;
      added.forEach(function (t) { S.bad.teams.push(t); }); renumberTeams(); commit();
    };
    $('[data-team-clear]', card).onclick = function () {
      if (!confirm(classById(cid).name + ' 반 조를 모두 지울까요?')) return;
      if (!confirmTeamChange()) return;
      S.bad.teams = S.bad.teams.filter(function (t) { return t.classId !== cid; }); renumberTeams(); commit();
    };
    $all('[data-seed-of]', card).forEach(function (sel) {
      sel.onchange = function () {
        if (!confirmTeamChange()) { render(); return; }
        var t = teamById(sel.dataset.seedOf); if (t) t.seed = num(sel.value); commit();
      };
    });
    $all('[data-del-team]', card).forEach(function (b) {
      b.onclick = function () {
        if (!confirmTeamChange()) return;
        S.bad.teams = S.bad.teams.filter(function (t) { return t.id !== b.dataset.delTeam; }); renumberTeams(); commit();
      };
    });
  });
  var gen = $('#btn-gen', root);
  if (gen) gen.onclick = function () {
    if (S.bad.bracket && Object.keys(S.bad.results).length && !confirm('이미 입력된 경기 결과가 있습니다. 새로 생성하면 결과가 모두 지워집니다. 계속할까요?')) return;
    var res = Bracket.generate(badTeamsForAlgo(), S.classes, badOpts());
    if (!res.slots) { alert('대진표를 만들 수 없습니다:\n' + (res.errors || []).join('\n')); return; }
    S.bad.bracket = { slots: res.slots, byeTeams: res.byeTeams, byeCount: res.byeCount, warnings: res.warnings, violations: res.violations, ok: res.ok, latin: res.latin, generatedAt: new Date().toLocaleString('ko-KR') };

        '<button type="button" class="btn ok" data-w="a">' + esc(teamFull(ta)) + ' 승 (3위)</button><button type="button" class="btn ok" data-w="b">' + esc(teamFull(tb)) + ' 승 (3위)</button>' +

/* ===================================================================
   배구 리그전: 6경기 고정 순서, 점수 입력, 순위 결정(승자승·미니리그·추첨)
   =================================================================== */
var VOL_ORDER = [[0, 1], [2, 3], [0, 2], [1, 3], [0, 3], [1, 2]]; // 반 인덱스 쌍

function volGameTeams(i) { return { a: CLASS_IDS[VOL_ORDER[i][0]], b: CLASS_IDS[VOL_ORDER[i][1]] }; }

/* 순위 계산. 반환 {rows:[{classId, played,w,l,pf,pa,diff,rank,points,reason,needDraw}], done} */
function volStandings() {
  var st = {};
  CLASS_IDS.forEach(function (c) { st[c] = { classId: c, played: 0, w: 0, l: 0, pf: 0, pa: 0, diff: 0 }; });
  var played = [];
  S.vol.games.forEach(function (g, i) {
    if (!g) return;
    var t = volGameTeams(i);
    var sa = num(g.a), sb = num(g.b);
    if (sa === sb) return;
    played.push({ a: t.a, b: t.b, sa: sa, sb: sb });
    st[t.a].played++; st[t.b].played++;
    st[t.a].pf += sa; st[t.a].pa += sb; st[t.b].pf += sb; st[t.b].pa += sa;
    if (sa > sb) { st[t.a].w++; st[t.b].l++; } else { st[t.b].w++; st[t.a].l++; }
  });
  CLASS_IDS.forEach(function (c) { st[c].diff = st[c].pf - st[c].pa; });

  // 1차: 승수로 묶기
  var groups = {};
  CLASS_IDS.forEach(function (c) { (groups[st[c].w] = groups[st[c].w] || []).push(c); });
  var winsDesc = Object.keys(groups).map(Number).sort(function (a, b) { return b - a; });
  var ordered = [];
  winsDesc.forEach(function (w) {
    var g = groups[w];
    if (g.length === 1) { ordered.push({ classId: g[0], reason: '승수', needDraw: false }); return; }
    resolveTieGroup(g, played, st).forEach(function (x) { ordered.push(x); });
  });
  var done = S.vol.games.every(function (g) { return g && num(g.a) !== num(g.b); });
  // 반영 점수는 6경기가 모두 끝나 순위가 확정된 뒤에만 종합 집계표에 들어간다
  var rows = ordered.map(function (o, i) {
    var s = st[o.classId];
    return { classId: o.classId, played: s.played, w: s.w, l: s.l, pf: s.pf, pa: s.pa, diff: s.diff, rank: i + 1, provisional: S.settings.pts.vol[i] || 0, points: done ? (S.settings.pts.vol[i] || 0) : 0, reason: played.length ? o.reason : '', needDraw: done && o.needDraw };
  });
  return { rows: rows, done: done, playedCount: played.length };
}

/* 동률 그룹 해소. 2팀: 승자승 → 전체 득실차/총득점/총실점 → 추첨. 3팀 이상: 미니리그 → 전체 → 추첨 */
function resolveTieGroup(group, played, st) {
  var keyNames, keyOf;
  if (group.length === 2) {
    var h = played.filter(function (p) { return (p.a === group[0] && p.b === group[1]) || (p.a === group[1] && p.b === group[0]); })[0];
    if (h) {
      var winner = h.sa > h.sb ? h.a : h.b, loser = winner === h.a ? h.b : h.a;
      return [{ classId: winner, reason: '승자승', needDraw: false }, { classId: loser, reason: '승자승', needDraw: false }];
    }
    keyNames = ['득실차', '총득점', '총실점(적은 순)'];
    keyOf = function (c) { return [st[c].diff, st[c].pf, -st[c].pa]; };
  } else {
    // 미니리그: 동률 팀끼리 치른 경기만
    var mini = {};
    group.forEach(function (c) { mini[c] = { w: 0, pf: 0, pa: 0 }; });
    played.forEach(function (p) {
      if (group.indexOf(p.a) < 0 || group.indexOf(p.b) < 0) return;
      mini[p.a].pf += p.sa; mini[p.a].pa += p.sb; mini[p.b].pf += p.sb; mini[p.b].pa += p.sa;
      if (p.sa > p.sb) mini[p.a].w++; else mini[p.b].w++;
    });
    keyNames = ['미니리그 승수', '미니리그 득실차', '미니리그 총득점', '득실차', '총득점', '총실점(적은 순)'];
    keyOf = function (c) { return [mini[c].w, mini[c].pf - mini[c].pa, mini[c].pf, st[c].diff, st[c].pf, -st[c].pa]; };
  }
  var manual = S.vol.manual || {};
  var items = group.map(function (c) { return { classId: c, key: keyOf(c) }; });
  items.sort(function (x, y) {
    for (var i = 0; i < x.key.length; i++) if (x.key[i] !== y.key[i]) return y.key[i] - x.key[i];
    var mx = manual[x.classId], my = manual[y.classId];
    if (mx !== undefined && my !== undefined) return mx - my;
    if (mx !== undefined) return -1; if (my !== undefined) return 1;
    return 0;
  });
  // 사유: 위·아래 이웃 팀과 갈린 기준 중 더 깊은 것
  return items.map(function (it, i) {
    var level = -1, draw = false;
    [items[i - 1], items[i + 1]].forEach(function (other) {
      if (!other) return;
      var lv = -1;
      for (var k = 0; k < it.key.length; k++) if (it.key[k] !== other.key[k]) { lv = k; break; }
      if (lv < 0) {
        lv = it.key.length;
        if (manual[it.classId] === undefined || manual[other.classId] === undefined) draw = true;
      }
      if (lv > level) level = lv;
    });
    var reason = level < 0 ? '' : (level < keyNames.length ? keyNames[level] : (draw ? '모든 기준 동일' : '추첨(수동 지정)'));
    return { classId: it.classId, reason: (group.length >= 3 ? '3팀 이상 동률 → ' : '') + reason, needDraw: draw };
  });
}

/* ===================================================================
   레이저 사격 · 킨볼
   =================================================================== */
function laserRanking() {
  var max = num(S.settings.laserMax, 10);
  var rows = CLASS_IDS.map(function (c) {
    var arr = (S.laser.scores[c] || []).slice(0, 7);
    while (arr.length < 7) arr.push(null);
    var vals = arr.map(function (v) { return v === null || v === '' ? 0 : num(v); });
    var sum = vals.reduce(function (a, b) { return a + b; }, 0);
    var sorted = vals.slice().sort(function (a, b) { return b - a; });
    var incomplete = arr.some(function (v) { return v === null || v === ''; });
    var invalid = vals.some(function (v) { return v < 0 || v > max; });
    return { classId: c, vals: vals, sum: sum, best: sorted[0], sorted: sorted, incomplete: incomplete, invalid: invalid };
  });
  var manual = S.laser.manual || {};
  rows.sort(function (x, y) {
    if (x.sum !== y.sum) return y.sum - x.sum;
    if (x.best !== y.best) return y.best - x.best;
    for (var i = 0; i < 7; i++) if (x.sorted[i] !== y.sorted[i]) return y.sorted[i] - x.sorted[i];
    var mx = manual[x.classId], my = manual[y.classId];
    if (mx !== undefined && my !== undefined) return mx - my;
    if (mx !== undefined) return -1; if (my !== undefined) return 1;
    return 0;
  });
  // 4개 반 모두 점수가 하나라도 입력된 뒤에야 종합 집계표에 반영한다 (아무것도 없는 반이 순위 점수를 받지 않도록)
  var active = rows.every(function (r) { return r.vals.some(function (v, i) { var raw = (S.laser.scores[r.classId] || [])[i]; return raw !== null && raw !== undefined && raw !== ''; }); });
  rows.forEach(function (r, i) {
    r.rank = i + 1; r.provisional = S.settings.pts.laser[i] || 0; r.points = active ? r.provisional : 0; r.active = active;
    r.reason = ''; r.needDraw = false;
    if (!active) return;
    // 위·아래 이웃 중 더 깊은 기준까지 가야 갈리는 쪽을 사유로 표시
    var level = -1, draw = false, manualDraw = false;
    [rows[i - 1], rows[i + 1]].forEach(function (o) {
      if (!o) return;
      var lv;
      if (r.sum !== o.sum) lv = 0;
      else if (r.best !== o.best) lv = 1;
      else if (r.sorted.join() !== o.sorted.join()) lv = 2;
      else { lv = 3; if (manual[r.classId] !== undefined && manual[o.classId] !== undefined) manualDraw = true; else draw = true; }
      if (lv > level) level = lv;
    });
    r.reason = ['합산', '최고 사로 점수', '내림차순 순차 비교', draw ? '모든 기준 동일' : '추첨(수동 지정)'][level] || '';
    r.needDraw = draw;
  });
  return rows;
}

function kinPoints() {

    [1, 2, 3, 4].forEach(function (rank) {

    });

}

}

var OVERALL_COLS = [['bad', '배드민턴'], ['kin1', '킨볼 1조'], ['kin2', '킨볼 2조'], ['kin3', '킨볼 3조'], ['vol', '배구'], ['laser', '레이저 사격']];
var TB_NAMES = { bad: '배드민턴', vol: '배구', kin: '킨볼', laser: '레이저 사격', cheer: '응원·질서' };

function autoValues() {
  var bad = badClassPoints().total;
  var kin = kinPoints();
  var vol = {}; volStandings().rows.forEach(function (r) { vol[r.classId] = r.points; });
  var laser = {}; laserRanking().forEach(function (r) { laser[r.classId] = r.points; });
  var out = {};
  CLASS_IDS.forEach(function (c) {
    out[c] = { bad: bad[c] || 0, kin1: kin.rounds[0][c] || 0, kin2: kin.rounds[1][c] || 0, kin3: kin.rounds[2][c] || 0, vol: vol[c] || 0, laser: laser[c] || 0 };
  });
  return out;
}
function computeOverall() {
  var auto = autoValues();
  var ov = S.overall;
  var rows = CLASS_IDS.map(function (c) {
    var vals = {}, modified = {};
    OVERALL_COLS.forEach(function (col) {
      var k = col[0];
      var o = ov.overrides[c] && ov.overrides[c][k];
      if (o !== undefined && o !== null) { vals[k] = num(o); modified[k] = true; } else vals[k] = auto[c][k];
    });
    var cheer = num(ov.cheer[c]), extra = num(ov.extra[c]);
    var sum = OVERALL_COLS.reduce(function (a, col) { return a + vals[col[0]]; }, 0) + cheer + extra;
    return { classId: c, vals: vals, auto: auto[c], modified: modified, cheer: cheer, extra: extra, total: sum, reason: '', needDraw: false };
  });
  var tb = S.settings.tiebreak;
  var keyOf = function (r) {
    return [r.total].concat(tb.map(function (k) {
      if (k === 'kin') return r.vals.kin1 + r.vals.kin2 + r.vals.kin3;
      if (k === 'cheer') return r.cheer;
      return r.vals[k];
    }));
  };
  var manual = ov.manualRank || {};
  rows.forEach(function (r) { r.key = keyOf(r); });
  rows.sort(function (x, y) {
    for (var i = 0; i < x.key.length; i++) if (x.key[i] !== y.key[i]) return y.key[i] - x.key[i];
    var mx = manual[x.classId], my = manual[y.classId];
    if (mx !== undefined && my !== undefined) return mx - my;
    if (mx !== undefined) return -1; if (my !== undefined) return 1;
    return 0;
  });
  rows.forEach(function (r, i) {
    r.rank = i + 1;
    var level = -1, draw = false;
    [rows[i - 1], rows[i + 1]].forEach(function (o) {
      if (!o || o.key[0] !== r.key[0]) return;
      if (r.key.every(function (v) { return v === 0; }) && o.key.every(function (v) { return v === 0; })) return; // 아직 아무 점수도 없음
      var lv = -1;
      for (var k = 1; k < r.key.length; k++) if (r.key[k] !== o.key[k]) { lv = k; break; }
      if (lv < 0) { lv = r.key.length; if (manual[r.classId] === undefined || manual[o.classId] === undefined) draw = true; }
      if (lv > level) level = lv;
    });
    if (level >= 1 && level < r.key.length) r.reason = '동점 → ' + TB_NAMES[tb[level - 1]] + ' 점수';
    else if (level >= r.key.length) { r.reason = draw ? '동점 → 모든 기준 동일' : '동점 → 추첨(수동)'; r.needDraw = draw; }
  });
  return { rows: rows };
}

function lotteryPools() {
  var winners = S.lottery.winners;
  var isWon = function (c, s) { return winners.some(function (w) { return w.classId === c && w.no === s.no && w.name === s.name; }); };
  var pools = {}, wonCount = {};
  CLASS_IDS.forEach(function (c) {
    pools[c] = (S.roster[c] || []).filter(function (s) { return !isWon(c, s); });
    wonCount[c] = winners.filter(function (w) { return w.classId === c; }).length;
  });
  return { pools: pools, wonCount: wonCount };

  var rows = st.rows.map(function (r) { var c = classById(r.classId); return [{ text: r.rank + '위', bold: true }, { text: c.name, color: c.color, bold: true }, r.played, r.w, r.l, r.pf, r.pa, (r.diff > 0 ? '+' : '') + r.diff, { text: r.reason || '', size: 12 }, { text: fmt(r.points), bold: true }]; });
  drawTablePng('RAS 스포츠 축제 · 배구 리그전 순위표', ['순위', '반', '경기', '승', '패', '득점', '실점', '득실차', '순위 결정 기준', '반영 점수'], rows, [70, 90, 60, 60, 60, 70, 70, 80, 260, 100], '배구순위표_' + todayStr() + '.png');
}
function exportBracketPng() {
  var rounds = currentRounds(); if (!rounds) return;
  var scale = 2, colW = 230, gap = 40, unit = 58, boxH = 50, top = 90, left = 20;
  var width = left * 2 + 7 * colW + 6 * gap;
  var height = top + 32 * unit + 40;
  var cv = document.createElement('canvas'); cv.width = width * scale; cv.height = height * scale;
  var ctx = cv.getContext('2d'); ctx.scale(scale, scale);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#111'; ctx.font = '900 24px ' + CANVAS_FONT; ctx.textBaseline = 'middle';
  ctx.fillText('RAS 스포츠 축제 · 배드민턴 복식 대진표 (' + new Date().toLocaleDateString('ko-KR') + ')', left, 30);
  var third = thirdPlaceInfo(rounds);
  var sideText = function (id, m, x, y, w) {
    if (id === 'BYE') { ctx.fillStyle = '#777'; ctx.font = 'italic 600 12px ' + CANVAS_FONT; ctx.fillText('부전승', x + 6, y); return; }
    if (!id) { ctx.fillStyle = '#999'; ctx.font = '600 12px ' + CANVAS_FONT; ctx.fillText('(대기)', x + 6, y); return; }
    var t = teamById(id); if (!t) return; var c = classById(t.classId);
    if (m.winner === id) { ctx.fillStyle = '#d1fae5'; ctx.fillRect(x + 1, y - 11, w - 2, 22); }
    ctx.fillStyle = c.color; ctx.fillRect(x + 4, y - 8, 34, 16); ctx.fillStyle = '#fff'; ctx.font = '900 10px ' + CANVAS_FONT; ctx.textAlign = 'center'; ctx.fillText(c.name, x + 21, y); ctx.textAlign = 'left';
    ctx.fillStyle = m.winner && m.winner !== id ? '#888' : '#111'; ctx.font = '800 12px ' + CANVAS_FONT;
    var label = t.num + '조' + (num(t.seed) ? ['', '①', '②', '③', '④'][num(t.seed)] : '') + ' ' + t.p1 + '·' + t.p2;
    ctx.fillText(label.length > 16 ? label.slice(0, 16) + '…' : label, x + 42, y);
    if (m.winner === id) { ctx.fillStyle = '#047857'; ctx.font = '900 11px ' + CANVAS_FONT; ctx.textAlign = 'right'; ctx.fillText(m.type === 'bye' ? '부전승' : m.type === 'forfeit' ? '몰수승' : '승', x + w - 4, y); ctx.textAlign = 'left'; }
  };
  var centerY = function (r, i) { return top + (i + 0.5) * unit * Math.pow(2, r); };
  rounds.forEach(function (ms, r) {
    var x = left + r * (colW + gap);
    ctx.fillStyle = '#111'; ctx.font = '900 15px ' + CANVAS_FONT; ctx.textAlign = 'center'; ctx.fillText(Bracket.ROUND_NAMES[r], x + colW / 2, top - 20); ctx.textAlign = 'left';
    ms.forEach(function (m, i) {
      var cy = centerY(r, i);
      ctx.strokeStyle = m.winner && m.type !== 'bye' ? '#047857' : '#9ca3af'; ctx.lineWidth = 1.5;
      ctx.fillStyle = '#fff'; ctx.fillRect(x, cy - boxH / 2, colW, boxH); ctx.strokeRect(x, cy - boxH / 2, colW, boxH);
      ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(x + colW, cy); ctx.stroke();
      sideText(m.a, m, x, cy - boxH / 4, colW); sideText(m.b, m, x, cy + boxH / 4, colW);
      if (r < 5) { // 다음 라운드 연결선
        var ny = centerY(r + 1, Math.floor(i / 2)); var nx = x + colW + gap;
        ctx.strokeStyle = '#9ca3af'; ctx.beginPath(); ctx.moveTo(x + colW, cy); ctx.lineTo(x + colW + gap / 2, cy); ctx.lineTo(x + colW + gap / 2, ny); ctx.lineTo(nx, ny); ctx.stroke();
      }
    });
  });
  // 3·4위전
  var tx = left + 6 * (colW + gap), ty = centerY(5, 0) + 120;
  ctx.fillStyle = '#111'; ctx.font = '900 15px ' + CANVAS_FONT; ctx.textAlign = 'center'; ctx.fillText('3·4위전 (반 점수 무관)', tx + colW / 2, ty - boxH / 2 - 14); ctx.textAlign = 'left';
  ctx.strokeStyle = '#9ca3af'; ctx.strokeRect(tx, ty - boxH / 2, colW, boxH); ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + colW, ty); ctx.stroke();
  if (third) { sideText(third.a, third, tx, ty - boxH / 4, colW); sideText(third.b, third, tx, ty + boxH / 4, colW); }
  canvasDownload(cv, '배드민턴대진표_' + todayStr() + '.png');
}


/* ===================================================================
   데이터 유지 강화: IndexedDB 이중 저장 + 복구 지점 + 백업 알림 + 오프라인(서비스 워커)
   - localStorage가 비어 있고 IndexedDB에 데이터가 있으면 자동 복구
   - 변경 때마다 복구 지점(스냅샷) 저장: 10분 단위로 1개, 최대 60개
   =================================================================== */
var IDB_NAME = 'ras-sports-festival', IDB_VER = 1;
var idbPromise = null;
function idbOpen() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise(function (resolve, reject) {
    try {
      if (!window.indexedDB) return reject(new Error('IndexedDB 없음'));
      var req = indexedDB.open(IDB_NAME, IDB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', { keyPath: 'at' });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    } catch (e) { reject(e); }
  });
  return idbPromise;
}
function idbPut(store, value, key) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(store, 'readwrite');
      var r = key !== undefined ? tx.objectStore(store).put(value, key) : tx.objectStore(store).put(value);
      tx.oncomplete = function () { resolve(r.result); }; tx.onerror = function () { reject(tx.error); };
    });
  });
}
function idbGet(store, key) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var r = db.transaction(store, 'readonly').objectStore(store).get(key);
      r.onsuccess = function () { resolve(r.result); }; r.onerror = function () { reject(r.error); };
    });
  });
}
function idbAll(store) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var r = db.transaction(store, 'readonly').objectStore(store).getAll();
      r.onsuccess = function () { resolve(r.result || []); }; r.onerror = function () { reject(r.error); };
    });
  });
}
function idbDelete(store, key) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key);
      tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); };
    });
  });
}

/* 상태 요약 한 줄 (복구 지점 목록용) */
function stateSummary(st) {
  try {
    var parts = [];
    var teams = (st.bad && st.bad.teams || []).length; if (teams) parts.push('배드민턴 ' + teams + '조' + (st.bad.bracket ? ', 대진표 있음' : '') + (st.bad.results ? ', 결과 ' + Object.keys(st.bad.results).length + '건' : ''));
    var vol = (st.vol && st.vol.games || []).filter(Boolean).length; if (vol) parts.push('배구 ' + vol + '경기');
    var kin = (st.kin && st.kin.rounds || []).filter(function (r) { return r && r[1]; }).length; if (kin) parts.push('킨볼 ' + kin + '조');
    var win = (st.lottery && st.lottery.winners || []).length; if (win) parts.push('당첨 ' + win + '명');
    var roster = 0; Object.keys(st.roster || {}).forEach(function (k) { roster += (st.roster[k] || []).length; }); if (roster) parts.push('명단 ' + roster + '명');
    return parts.length ? parts.join(' / ') : '빈 상태';
  } catch (e) { return ''; }
}

var lastSnapBucket = 0;
var mirrorPending = null;
/* saveState()가 부른다: IndexedDB에 현재 상태 복사 + 10분 단위 복구 지점 */
function persistMirror(json) {
  mirrorPending = json;
  idbPut('kv', json, 'current').catch(function (e) { console.warn('IDB 저장 실패', e); });
  var now = Date.now(), bucket = Math.floor(now / 600000);
  if (bucket !== lastSnapBucket) {
    lastSnapBucket = bucket;
    saveSnapshot(json, '자동').catch(function () {});
  }
}
function saveSnapshot(json, label) {
  var at = Date.now();
  return idbPut('snapshots', { at: at, label: label || '자동', summary: stateSummary(JSON.parse(json)), json: json }).then(function () {
    return idbAll('snapshots');
  }).then(function (all) {
    all.sort(function (a, b) { return a.at - b.at; });
    var extra = all.length - 60;
    var dels = [];
    for (var i = 0; i < extra; i++) dels.push(idbDelete('snapshots', all[i].at));
    return Promise.all(dels);
  });
}
/* 시작 시: localStorage가 비어 있으면 IndexedDB 복사본으로 복구 */
function restoreFromMirrorIfNeeded() {
  var hasLocal = false;
  try { hasLocal = !!localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (hasLocal) return Promise.resolve(false);
  return idbGet('kv', 'current').then(function (json) {
    if (!json) return false;
    var data = JSON.parse(json);
    if (!data || !data.classes) return false;
    S = mergeDeep(defaultState(), data);
    try { localStorage.setItem(STORAGE_KEY, json); } catch (e) {}
    return true;
  }).catch(function () { return false; });
}
function renderRestorePoints(el) {
  if (!el) return;
  idbAll('snapshots').then(function (all) {
    all.sort(function (a, b) { return b.at - a.at; });
    if (!all.length) { el.innerHTML = '<span class="muted small">아직 복구 지점이 없습니다. 입력을 시작하면 자동으로 생깁니다.</span>'; return; }
    el.innerHTML = all.slice(0, 40).map(function (s) {
      return '<div class="s"><span class="t"><b>' + esc(new Date(s.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })) + '</b> <span class="tag">' + esc(s.label) + '</span><br><span class="muted small">' + esc(s.summary) + '</span></span><button type="button" class="btn sm" data-restore="' + s.at + '">이 시점으로 복구</button></div>';
    }).join('');
    $all('[data-restore]', el).forEach(function (b) {
      b.onclick = function () {
        var at = num(b.dataset.restore);
        var snap = all.filter(function (s) { return s.at === at; })[0]; if (!snap) return;
        if (!confirm(new Date(at).toLocaleString('ko-KR') + ' 시점의 상태로 되돌릴까요? 현재 상태는 복구 지점으로 먼저 저장됩니다.')) return;
        saveSnapshot(JSON.stringify(S), '복구 전').then(function () {
          S = mergeDeep(defaultState(), JSON.parse(snap.json)); commit();
          alert('복구했습니다.');
        });
      };
    });
  }).catch(function () { el.innerHTML = '<span class="muted small">이 브라우저에서는 복구 지점을 쓸 수 없습니다.</span>'; });
}

/* 백업 알림: 의미 있는 데이터가 있고, 마지막 백업 후 3시간 넘게 변경이 쌓였으면 안내 */
function updateBackupBanner() {
  var b = document.getElementById('backup-banner'); if (!b) return;
  var meaningful = (S.bad.teams && S.bad.teams.length) || S.vol.games.some(Boolean) || (S.lottery.winners && S.lottery.winners.length) || S.kin.rounds.some(function (r) { return r && r[1]; });
  var last = S.meta && S.meta.lastBackupAt, changed = S.meta && S.meta.lastChangeAt;
  var stale = !last || (changed && changed - last > 3 * 3600 * 1000);
  if (meaningful && stale) {
    b.hidden = false;
    b.innerHTML = '<div class="row between"><span>' + (last ? '마지막 JSON 백업 이후 3시간 넘게 변경이 쌓였습니다.' : '아직 JSON 백업을 한 번도 받지 않았습니다.') + ' 하루 한 번은 파일로 백업해 두면 기기가 바뀌어도 이어갈 수 있습니다.</span><button type="button" class="btn sm primary" id="btn-backup-banner">지금 백업</button></div>';
    var btn = document.getElementById('btn-backup-banner'); if (btn) btn.onclick = exportJson;
  } else b.hidden = true;
}

/* 오프라인·설치: 배포 주소(http/https)에서만 서비스 워커와 매니페스트를 등록한다. 파일로 직접 열면 건너뛴다. */
function setupOffline() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    var icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f1419"/><text x="32" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="26" fill="#fff">RAS</text></svg>');
    var manifest = { name: 'RAS 스포츠 축제 운영판', short_name: 'RAS 축제', start_url: location.pathname, scope: location.pathname.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#eceff3', theme_color: '#0f1419', icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml' }] };
    var link = document.createElement('link'); link.rel = 'manifest'; link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)); document.head.appendChild(link);
    var meta = document.createElement('meta'); meta.name = 'theme-color'; meta.content = '#0f1419'; document.head.appendChild(meta);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  } catch (e) {}
}

   시작
   =================================================================== */
(function init() {
  loadState();
  applyFontSize();
  $all('nav.tabs button').forEach(function (b) { b.onclick = function () { showTab(b.dataset.tab); }; });
  $('#btn-scoreboard').onclick = openScoreboard;
  $('#btn-scoreboard-close').onclick = closeScoreboard;
  $('#btn-backup-now').onclick = exportJson;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); if ($('#scoreboard').classList.contains('on')) closeScoreboard(); } });
  $('#modal-bg').addEventListener('click', function (e) { if (e.target === e.currentTarget) closeModal(); });
  ensureTimers();
  setInterval(tickTimers, 250);
  // 상태가 바뀔 때마다 전광판도 갱신
  var origRender = render;
  render = function () { origRender(); renderScoreboard(); };
  // 자동 저장 가능 여부 확인 (사생활 보호 모드 등)
  try { localStorage.setItem(STORAGE_KEY + '-test', '1'); localStorage.removeItem(STORAGE_KEY + '-test'); } catch (e) { storageOk = false; }
  updateWarnBanner();
  setupOffline();
  // localStorage가 비었으면 IndexedDB 복사본으로 복구한 뒤 화면을 그린다
  restoreFromMirrorIfNeeded().then(function (restored) {
    showTab(S.ui.tab || 'settings');
    updateBackupBanner();
    if (restored) alert('브라우저 저장소가 비어 있어 보조 저장소(IndexedDB)의 복사본에서 데이터를 복구했습니다.');
  });
  window.RAS = { S: function () { return S; }, Bracket: Bracket, verify: function (n) { return Bracket.verify(n || 1000, console.log); } };
})();
